[project]
name = "serverless-document-review-announcer"
version = "0.1.0"
description = "SharePoint-triggered document reviewer on Azure Functions Serverless Agents."
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.14,<4",
    "azure-ai-documentintelligence==1.0.2",
    "azure-connectors==0.4.0b1",
    "azure-data-tables>=12.7.0,<13",
    "azure-identity>=1.25.0,<2",
    "azurefunctions-agents-runtime[monitor]==0.1.0b9",
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["../tests"]
pythonpath = ["."]

[tool.uv]
default-groups = ["dev"]
